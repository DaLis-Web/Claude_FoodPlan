name: Publikuoti programėlę (GitHub Pages)

# Reikia vieną kartą: repozitorija vieša ir Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main, 'claude/**']
  workflow_run:
    workflows: ['Kainų ir akcijų atnaujinimas', 'Receptų nuotraukos']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Publikuojama tik iš pagrindinės šakos.
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Paruošti failus
        run: |
          mkdir -p site
          cp -r index.html styles.css sw.js manifest.webmanifest js icons data site/
          sed -i "s/const VERSION = 'v1';/const VERSION = '${GITHUB_SHA::8}';/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
